<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六角西餐廳 - 後台管理</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="stylesheets/all.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar vh-100 border-end d-flex bg-white flex-column pt-3">
        <!-- 後台名稱 -->
        <div class="px-4"><strong>六角西餐廳</strong> - 後台管理</div>
        <!-- 選單 -->
        <div class="overflow-auto mt-3">
          <div>
            <a href="home.html" class="sidebar-link active"
              ><div class="px-4">首頁</div></a
            >
          </div>
          <div>
            <a
              href="#menu-order"
              class="sidebar-link"
              data-bs-toggle="collapse"
              role="button"
              aria-expanded="false"
              aria-controls="menu-order"
              ><div class="d-flex justify-content-between px-4">
                <p class="mb-0">訂單管理</p>
                <i class="bi bi-caret-down"></i></div
            ></a>
            <div class="collapse" id="menu-order">
              <div class="ps-5">
                <a href="orders.html" class="sidebar-link">全部訂單</a>
                <a href="order.html" class="sidebar-link">單一訂單</a>
              </div>
            </div>
          </div>
        </div>
        <!-- 登出按鈕(ICON自行補上) -->
        <a href="#" class="mt-auto sidebar-link"
          ><div class="px-4"><i class="bi bi-box-arrow-right"></i> 登出</div></a
        >
      </aside>
      <main class="main">
        <div class="bg-white w-10 border-bottom sticky-top">
          <a
            href="#"
            class="d-inline-block py-3 px-4 border-end"
            id="toggle-btn"
            ><i class="bi bi-arrows-angle-expand"></i
          ></a>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascripts/all.js"></script>
  </body>
</html>
