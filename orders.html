    <div class="d-flex">

        <!-- 後台名稱 -->
        <div class="px-4"><strong>六角西餐廳</strong> - 後台管理</div>
        <!-- 選單 -->

          <div>
            <a href="#" class="sidebar-link active"
              ><div class="px-4">首頁</div></a
            >
          </div>
          <div>
            <a
              href="#menu-order"
              class="sidebar-link"
              data-bs-toggle="collapse"
              role="button"
              aria-expanded="false"
              aria-controls="menu-order"
              ><div class="d-flex justify-content-between px-4">
                <p class="mb-0">訂單管理</p>
                <i class="bi bi-caret-down"></i></div
            ></a>
            <div class="collapse" id="menu-order">
              <div class="ps-5">
                <a href="#" class="sidebar-link">全部訂單</a>
                <a href="#" class="sidebar-link">單一訂單</a>
              </div>
            </div>
          </div>
        </div>
        <!-- 登出按鈕(ICON自行補上) -->
        <a href="#" class="mt-auto sidebar-link"

        >

        <div class="bg-white w-10 border-bottom sticky-top">
          <a

            class="d-inline-block py-3 px-4 border-end"
            id="toggle-btn"
            ><i class="bi bi-arrows-angle-expand"></i

        </div>
        <div class="p-4">

            <li class="nav-item">
              <a
                class="nav-link rounded-pill active"

                href="#"

                <span class="badge rounded-pill bg-light text-dark">3</span></a

            </li>
            <li class="nav-item">
              <a class="nav-link rounded-pill" href="#"

                <span class="badge rounded-pill bg-light text-dark">1</span></a

            <li class="nav-item">
              <a class="nav-link rounded-pill" href="#"
                >已出貨
                <span class="badge rounded-pill bg-light text-dark">1</span></a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link rounded-pill" href="#"
                >退款
                <span class="badge rounded-pill bg-light text-dark">1</span></a
              >
            </li>
          </ul>

          <div class="card shadow-sm">
            <div class="card-header bg-transparent">
              <div class="input-group">
                <span class="input-group-text border-0 bg-transparent pe-0"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  type="search"
                  class="form-control border-0 bg-transparent shadow-none"
                />
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive" style="min-height: 201px">
                <table class="table table-hover mb-0">
                  <thead class="bg-light">
                    <tr class="align-middle">
                      <th scope="col" class="py-3 ps-4">
                        <input type="checkbox" class="form-check-input" />
                      </th>
                      <th scope="col">訂單編號</th>
                      <th scope="col">Email</th>
                      <th scope="col">用戶姓名</th>
                      <th scope="col">購買品項</th>
                      <th scope="col">付款狀態</th>
                      <th scope="col">購買金額</th>
                      <th scope="col" class="pe-4">編輯</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="align-middle text-nowrap">
                      <th scope="col" class="py-3 ps-4">
                        <input type="checkbox" class="form-check-input" />
                      </th>
                      <th scope="col">ABC1234567</th>
                      <th scope="col">example@example.com</th>
                      <th scope="col">John Doe</th>
                      <th scope="col">大麥克全餐</th>
                      <th scope="col">已付款</th>
                      <th scope="col">NT$1,111</th>
                      <th scope="col" class="pe-4">
                        <div class="btn-group">
                          <a href="#" class="btn btn-sm btn-outline-dark me=2">
                            編輯
                            <i class="bi bi-pen"> </i>
                          </a>
                          <button
                            class="btn btn-sm btn-outline-dark dropdown-toggle"
                            type="button"
                            id="dropdownMenuButton1"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                          >
                            操作
                          </button>
                          <ul
                            class="dropdown-menu"
                            aria-labelledby="dropdownMenuButton1"
                          >
                            <li>
                              <a class="dropdown-item" href="#">修改狀態</a>
                            </li>
                            <li>
                              <a class="dropdown-item" href="#">刪除訂單</a>
                            </li>
                          </ul>
                        </div>
                      </th>
                    </tr>

                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer bg-transparent py-3 mb-0">
              <nav
                aria-label="Page navigation example"
                class="d-flex justify-content-end"
              >
                <ul class="pagination">
                  <li class="page-item">
                    <a class="page-link" href="#" tabindex="-1">Previous</a>
                  </li>
                  <li class="page-item"><a class="page-link" href="#">1</a></li>
                  <li class="page-item active" aria-current="page">
                    <a class="page-link" href="#">2</a>
