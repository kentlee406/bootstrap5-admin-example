<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六角西餐廳 - 後台管理</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="stylesheets/all.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar vh-100 border-end d-flex bg-white flex-column pt-3">
        <!-- 後台名稱 -->
        <div class="px-4"><strong>六角西餐廳</strong> - 後台管理</div>
        <!-- 選單 -->
        <div class="overflow-auto mt-3">
          <div>
            <a href="#" class="sidebar-link active"
              ><div class="px-4">首頁</div></a
            >
          </div>
          <div>
            <a
              href="#menu-order"
              class="sidebar-link"
              data-bs-toggle="collapse"
              role="button"
              aria-expanded="false"
              aria-controls="menu-order"
              ><div class="d-flex justify-content-between px-4">
                <p class="mb-0">訂單管理</p>
                <i class="bi bi-caret-down"></i></div
            ></a>
            <div class="collapse" id="menu-order">
              <div class="ps-5">
                <a href="#" class="sidebar-link">全部訂單</a>
                <a href="#" class="sidebar-link">單一訂單</a>
              </div>
            </div>
          </div>
        </div>
        <!-- 登出按鈕(ICON自行補上) -->
        <a href="#" class="mt-auto sidebar-link"
          ><div class="px-4"><i class="bi bi-box-arrow-right"></i> 登出</div></a
        >
      </aside>
      <main class="main">
        <div class="bg-white w-10 border-bottom sticky-top">
          <a
            href="#"
            class="d-inline-block py-3 px-4 border-end"
            id="toggle-btn"
            ><i class="bi bi-arrows-angle-expand"></i
          ></a>
        </div>
        <div class="p-4">
          <div class="row g-4 mb-3">
            <div class="col">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h2 class="display-6">在線人數</h2>
                  <p class="display-4 text-end">1,234</p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h2 class="display-6">訂單數量</h2>
                  <p class="display-4 text-end">1,234</p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h2 class="display-6">營業額</h2>
                  <p class="text-end">
                    NT$<span class="display-4">123,456</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-4 mb-4">
            <div class="col-lg-4">
              <div class="card shadow-sm mb-4 h-100">
                <canvas id="pie-chart"></canvas>
              </div>
            </div>
            <div class="col">
              <div class="card shadow-sm mb-4 h-100">
                <canvas id="bar-chart"></canvas>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-header bg-transparent">
              <div class="input-group">
                <span class="input-group-text border-0 bg-transparent pe-0"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  type="search"
                  class="form-control border-0 bg-transparent shadow-none"
                />
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover mb-0">
                  <thead class="bg-light">
                    <tr class="align-middle">
                      <th scope="col" class="py-3 ps-4">訂單編號</th>
                      <th scope="col">Email</th>
                      <th scope="col">用戶姓名</th>
                      <th scope="col">購買品項</th>
                      <th scope="col">付款狀態</th>
                      <th scope="col">購買金額</th>
                      <th scope="col" class="pe-4">編輯</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="align-middle text-nowrap">
                      <th scope="col" class="py-3 ps-4">ABC1234567</th>
                      <th scope="col">example@example.com</th>
                      <th scope="col">John Doe</th>
                      <th scope="col">大麥克全餐</th>
                      <th scope="col">已付款</th>
                      <th scope="col">NT$1,111</th>
                      <th scope="col" class="pe-4">
                        <input
                          type="button"
                          class="btn btn-primary"
                          value="編輯"
                        />
                      </th>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer bg-transparent py-3 mb-0">
              <nav
                aria-label="Page navigation example"
                class="d-flex justify-content-end"
              >
                <ul class="pagination">
                  <li class="page-item">
                    <a class="page-link" href="#" tabindex="-1">Previous</a>
                  </li>
                  <li class="page-item"><a class="page-link" href="#">1</a></li>
                  <li class="page-item active" aria-current="page">
                    <a class="page-link" href="#">2</a>
                  </li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      (() => {
        const chartColors = {
          red: "rgb(255, 99, 132)",
          orange: "rgb(255, 159, 64)",
          yellow: "rgb(255, 205, 86)",
          green: "rgb(75, 192, 192)",
          blue: "rgb(54, 162, 235)",
          purple: "rgb(153, 102, 255)",
          grey: "rgb(201, 203, 207)",
        };
        var randomScalingFactor = function () {
          return Math.round(Math.random() * 2000000);
        };

        const pieCtx = document.getElementById("pie-chart").getContext("2d");
        const barCtx = document.getElementById("bar-chart").getContext("2d");

        const config = {
          type: "pie",
          data: {
            datasets: [
              {
                data: [
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                ],
                backgroundColor: [
                  chartColors.red,
                  chartColors.orange,
                  chartColors.yellow,
                  chartColors.green,
                  chartColors.blue,
                ],
                label: "Dataset 1",
              },
            ],
            labels: [
              "大麥克全餐",
              "肥宅快樂水",
              "太爽啦義大利麵",
              "薯條加大吃不完",
              "兒童餐椅不給坐",
            ],
          },
          options: {
            responsive: true,
          },
        };
        const barConfig = {
          type: "bar",
          data: {
            datasets: [
              {
                data: [
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                  randomScalingFactor(),
                ],
                backgroundColor: [
                  chartColors.red,
                  chartColors.orange,
                  chartColors.yellow,
                  chartColors.green,
                  chartColors.blue,
                  chartColors.purple,
                  chartColors.red,
                  chartColors.orange,
                  chartColors.yellow,
                  chartColors.green,
                  chartColors.blue,
                  chartColors.purple,
                ],
                label: "Dataset 1",
              },
            ],
            labels: [
              "一月",
              "二月",
              "三月",
              "四月",
              "五月",
              "六月",
              "七月",
              "八月",
              "九月",
              "十月",
              "十一月",
              "十二月",
            ],
          },
          options: {
            responsive: true,
          },
        };
        const pieChart = new Chart(pieCtx, config);
        const barChart = new Chart(barCtx, barConfig);
      })();
    </script>

    <script src="javascripts/all.js"></script>
  </body>
</html>
