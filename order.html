<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六角西餐廳 - 後台管理</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="stylesheets/all.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar vh-100 border-end d-flex bg-white flex-column pt-3">
        <!-- 後台名稱 -->
        <div class="px-4"><strong>六角西餐廳</strong> - 後台管理</div>
        <!-- 選單 -->
        <ul class="list-unstyled overflow-auto mt-3">
          <li>
            <a href="home.html" class="sidebar-link active"
              ><div class="px-4">首頁</div></a
            >
          </li>
          <li>
            <a
              href="#menu-order"
              class="sidebar-link"
              data-bs-toggle="collapse"
              role="button"
              aria-expanded="false"
              aria-controls="menu-order"
              ><div class="d-flex justify-content-between px-4">
                <p class="mb-0">訂單管理</p>
                <i class="bi bi-caret-down menu-icon"></i></div
            ></a>
            <ul class="collapse list-unstyled" id="menu-order">
              <li class="ps-5">
                <a href="orders.html" class="sidebar-link">全部訂單</a>
              </li>
              <li class="ps-5">
                <a href="order.html" class="sidebar-link">單一訂單</a>
              </li>
            </ul>
          </li>
        </ul>
        <!-- 登出按鈕(ICON自行補上) -->
        <a href="#" class="mt-auto sidebar-link"
          ><div class="px-4"><i class="bi bi-box-arrow-right"></i> 登出</div></a
        >
      </aside>
      <main class="main">
        <div class="bg-white w-10 border-bottom sticky-top">
          <a
            href="#"
            class="d-inline-block py-3 px-4 border-end"
            id="toggle-btn"
            ><i class="bi bi-arrows-angle-expand"></i
          ></a>
        </div>
        <div class="p-4">
          <div class="row">
            <div class="col-lg-3 mb-3">
              <div class="list-group sticky-top pt-3" id="order-bookmark-nav">
                <a
                  class="list-group-item list-group-item-action order-bookmark-link active"
                  href="#order-summary"
                  >概要</a
                >
                <a
                  class="list-group-item list-group-item-action order-bookmark-link"
                  href="#order-items"
                  >購買品項</a
                >
                <a
                  class="list-group-item list-group-item-action order-bookmark-link"
                  href="#invoice-management"
                  >發票管理</a
                >
                <a
                  class="list-group-item list-group-item-action order-bookmark-link"
                  href="#danger-zone"
                  >危險區域</a
                >
              </div>
            </div>
            <div class="col">
              <section class="mb-4 order-section" id="order-summary">
                <h5 class="mb-3">概要</h5>
                <ul class="list-group">
                  <li class="list-group-item d-flex justify-content-between">
                    <span>訂單編號</span>
                    <span>ABC1234567</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>訂單金額</span>
                    <span>NT$1,111</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>訂單狀態</span>
                    <span>已付款</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>發票狀態</span>
                    <span>已開立</span>
                  </li>
                </ul>
              </section>

              <section class="mb-4 order-section" id="order-items">
                <h5 class="mb-3">購買品項</h5>
                <div class="table-responsive">
                  <table class="table table-bordered align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th scope="col" style="width: 72px">選取</th>
                        <th scope="col">編號</th>
                        <th scope="col">商品名稱</th>
                        <th scope="col">訂購數量</th>
                        <th scope="col">訂購狀態</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>
                          <input class="form-check-input" type="checkbox" />
                        </td>
                        <td>P001</td>
                        <td>經典牛排套餐</td>
                        <td>2</td>
                        <td>已出餐</td>
                      </tr>
                      <tr>
                        <td>
                          <input class="form-check-input" type="checkbox" />
                        </td>
                        <td>P002</td>
                        <td>凱薩沙拉</td>
                        <td>1</td>
                        <td>備餐中</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <section class="mb-4 order-section" id="invoice-management">
                <h5 class="mb-3">發票管理</h5>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="invoiceType" class="form-label">發票類型</label>
                    <select id="invoiceType" class="form-select">
                      <option>二聯式發票</option>
                      <option selected>三聯式發票</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="taxId" class="form-label">統一編號</label>
                    <input
                      id="taxId"
                      type="text"
                      class="form-control"
                      value="44332211"
                    />
                  </div>
                  <div class="col-12">
                    <label for="companyName" class="form-label">公司名稱</label>
                    <input
                      id="companyName"
                      type="text"
                      class="form-control"
                      value="六角西餐廳"
                    />
                  </div>
                  <div class="col-12 text-end">
                    <button type="button" class="btn btn-success">
                      更新資訊
                    </button>
                  </div>
                </div>
              </section>

              <section class="order-section" id="danger-zone">
                <h5 class="mb-3 text-danger">危險區域</h5>
                <button type="button" class="btn btn-danger">捐款</button>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascripts/all.js"></script>
  </body>
</html>
